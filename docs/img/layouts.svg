<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Menlo, 'DejaVu Sans Mono', 'JetBrains Mono', monospace" role="img" aria-label="Layout hotkeys: Cmd+Shift+1 opens a new tab with a 2 by 2 grid of Claude panes, Cmd+Shift+2 opens 4 columns by 2 rows, and Cmd+Shift+R restores the layout saved before the last restart and resumes each session">
<rect width="1000" height="300" rx="12" fill="#191724"/>
<!-- card 1: 2x2 -->
<rect x="24" y="24" width="300" height="252" rx="8" fill="#1f1d2e" stroke="#757477"/>
<text x="42" y="52" fill="#e0def4" font-size="13" font-weight="bold" xml:space="preserve">⌘⇧1  2 × 2</text>
<text x="42" y="70" fill="#7f7c8f" font-size="11" xml:space="preserve">new tab, 4 panes</text>
<g fill="#2a283d" stroke="#c4a7e7">
<rect x="42" y="88" width="130" height="78" rx="4"/>
<rect x="176" y="88" width="130" height="78" rx="4"/>
<rect x="42" y="170" width="130" height="78" rx="4"/>
<rect x="176" y="170" width="130" height="78" rx="4"/>
</g>
<g fill="#98c379" font-size="11" text-anchor="middle" xml:space="preserve">
<text x="107" y="131">claude</text>
<text x="241" y="131">claude</text>
<text x="107" y="213">claude</text>
<text x="241" y="213">claude</text>
</g>
<!-- card 2: 4x2 -->
<rect x="342" y="24" width="340" height="252" rx="8" fill="#1f1d2e" stroke="#757477"/>
<text x="360" y="52" fill="#e0def4" font-size="13" font-weight="bold" xml:space="preserve">⌘⇧2  4 × 2</text>
<text x="360" y="70" fill="#7f7c8f" font-size="11" xml:space="preserve">new tab, 4 columns by 2 rows, 8 panes</text>
<g fill="#2a283d" stroke="#c4a7e7">
<rect x="360" y="88" width="72" height="78" rx="4"/>
<rect x="436" y="88" width="72" height="78" rx="4"/>
<rect x="512" y="88" width="72" height="78" rx="4"/>
<rect x="588" y="88" width="72" height="78" rx="4"/>
<rect x="360" y="170" width="72" height="78" rx="4"/>
<rect x="436" y="170" width="72" height="78" rx="4"/>
<rect x="512" y="170" width="72" height="78" rx="4"/>
<rect x="588" y="170" width="72" height="78" rx="4"/>
</g>
<g fill="#98c379" font-size="10" text-anchor="middle" xml:space="preserve">
<text x="396" y="131">claude</text>
<text x="472" y="131">claude</text>
<text x="548" y="131">claude</text>
<text x="624" y="131">claude</text>
<text x="396" y="213">claude</text>
<text x="472" y="213">claude</text>
<text x="548" y="213">claude</text>
<text x="624" y="213">claude</text>
</g>
<!-- card 3: restore -->
<rect x="700" y="24" width="276" height="252" rx="8" fill="#1f1d2e" stroke="#e8b450"/>
<text x="718" y="52" fill="#e0def4" font-size="13" font-weight="bold" xml:space="preserve">⌘⇧R  restore</text>
<text x="718" y="70" fill="#7f7c8f" font-size="11" xml:space="preserve">after a WezTerm restart</text>
<rect x="718" y="88" width="240" height="40" rx="6" fill="#2a283d"/>
<text x="732" y="105" fill="#e0def4" font-size="11" xml:space="preserve">layout saved every 10 s</text>
<text x="732" y="120" fill="#7f7c8f" font-size="10" xml:space="preserve">cwd + session id per pane</text>
<path d="M838 130v14" stroke="#7f7c8f" stroke-width="1.5" fill="none"/>
<path d="M833 140l5 6 5-6" stroke="#7f7c8f" stroke-width="1.5" fill="none"/>
<rect x="718" y="148" width="240" height="40" rx="6" fill="#2a283d"/>
<text x="732" y="165" fill="#e0def4" font-size="11" xml:space="preserve">WezTerm restarts</text>
<text x="732" y="180" fill="#7f7c8f" font-size="10" xml:space="preserve">last layout kept aside</text>
<path d="M838 190v14" stroke="#7f7c8f" stroke-width="1.5" fill="none"/>
<path d="M833 200l5 6 5-6" stroke="#7f7c8f" stroke-width="1.5" fill="none"/>
<rect x="718" y="208" width="240" height="40" rx="6" fill="#2a283d" stroke="#e8b450"/>
<text x="732" y="225" fill="#e0def4" font-size="11" xml:space="preserve">press ⌘⇧R</text>
<text x="732" y="240" fill="#98c379" font-size="10" xml:space="preserve">panes return, claude --resume</text>
</svg>
