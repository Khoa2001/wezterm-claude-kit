<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 366" font-family="Menlo, 'DejaVu Sans Mono', 'JetBrains Mono', monospace" role="img" aria-label="How it works: Claude hooks write one small state file per WezTerm pane; the status line and the WezTerm tab bar read those files; a finished turn also plays a sound">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f7c8f"/></marker></defs>
<rect width="1000" height="366" rx="12" fill="#191724"/>
<rect x="24" y="30" width="260" height="172" rx="8" fill="#1f1d2e" stroke="#757477"/><text x="38" y="54" fill="#e0def4" font-size="13" font-weight="bold" text-anchor="start" xml:space="preserve">1. Claude sessions</text><text x="38" y="72" fill="#7f7c8f" font-size="11" text-anchor="start" xml:space="preserve">one per pane, own worktree</text>
<rect x="38" y="84" width="232" height="26" rx="13" fill="#2a283d"/><circle cx="54" cy="97" r="5" fill="#98c379"/>
<text x="68" y="101" fill="#e0def4" font-size="11" text-anchor="start" xml:space="preserve">pane 3  api:feat/auth</text>
<rect x="38" y="118" width="232" height="26" rx="13" fill="#2a283d"/><circle cx="54" cy="131" r="5" fill="#e8b450"/>
<text x="68" y="135" fill="#e0def4" font-size="11" text-anchor="start" xml:space="preserve">pane 4  api:fix/rate-limit</text>
<rect x="38" y="152" width="232" height="26" rx="13" fill="#2a283d"/><circle cx="54" cy="165" r="5" fill="#eb6f92"/>
<text x="68" y="169" fill="#e0def4" font-size="11" text-anchor="start" xml:space="preserve">pane 5  web:dark-mode</text>
<line x1="286" y1="116" x2="358" y2="116" stroke="#7f7c8f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="322" y="105" fill="#7f7c8f" font-size="11" text-anchor="middle" xml:space="preserve">hooks</text>
<rect x="360" y="30" width="270" height="172" rx="8" fill="#1f1d2e" stroke="#757477"/><text x="374" y="54" fill="#e0def4" font-size="13" font-weight="bold" text-anchor="start" xml:space="preserve">2. One small file per pane</text><text x="374" y="72" fill="#7f7c8f" font-size="11" text-anchor="start" xml:space="preserve">~/.claude/state/panes/</text>
<rect x="374" y="84" width="242" height="26" rx="6" fill="#2a283d"/>
<text x="388" y="101" fill="#e0def4" font-size="11" text-anchor="start" xml:space="preserve">3.json</text>
<text x="470" y="101" fill="#98c379" font-size="11" font-weight="bold" text-anchor="start" xml:space="preserve">idle</text>
<rect x="374" y="118" width="242" height="26" rx="6" fill="#2a283d"/>
<text x="388" y="135" fill="#e0def4" font-size="11" text-anchor="start" xml:space="preserve">4.json</text>
<text x="470" y="135" fill="#e8b450" font-size="11" font-weight="bold" text-anchor="start" xml:space="preserve">working</text>
<rect x="374" y="152" width="242" height="26" rx="6" fill="#2a283d"/>
<text x="388" y="169" fill="#e0def4" font-size="11" text-anchor="start" xml:space="preserve">5.json</text>
<text x="470" y="169" fill="#eb6f92" font-size="11" font-weight="bold" text-anchor="start" xml:space="preserve">needs-you</text>
<line x1="632" y1="163" x2="704" y2="163" stroke="#7f7c8f" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="706" y="30" width="270" height="82" rx="8" fill="#1f1d2e" stroke="#757477"/><text x="720" y="54" fill="#e0def4" font-size="13" font-weight="bold" text-anchor="start" xml:space="preserve">3a. Status line</text><text x="720" y="72" fill="#7f7c8f" font-size="11" text-anchor="start" xml:space="preserve">repo, branch, changes, context</text>
<rect x="706" y="120" width="270" height="82" rx="8" fill="#1f1d2e" stroke="#757477"/><text x="720" y="144" fill="#e0def4" font-size="13" font-weight="bold" text-anchor="start" xml:space="preserve">3b. WezTerm tab bar</text><text x="720" y="162" fill="#7f7c8f" font-size="11" text-anchor="start" xml:space="preserve">dots, rose tint, counts, usage</text>
<line x1="154" y1="204" x2="154" y2="258" stroke="#7f7c8f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="166" y="236" fill="#7f7c8f" font-size="11" text-anchor="start" xml:space="preserve">a turn ends or a session waits</text>
<rect x="24" y="260" width="260" height="74" rx="8" fill="#1f1d2e" stroke="#e8b450"/><text x="38" y="284" fill="#e0def4" font-size="13" font-weight="bold" text-anchor="start" xml:space="preserve">Sound and banner</text><text x="38" y="302" fill="#7f7c8f" font-size="11" text-anchor="start" xml:space="preserve">ping when done, banner if it waits</text>
<text x="360" y="284" fill="#7f7c8f" font-size="11" text-anchor="start" xml:space="preserve">The hooks only write the files, and the WezTerm tab bar reads them. The status line</text>
<text x="360" y="302" fill="#7f7c8f" font-size="11" text-anchor="start" xml:space="preserve">reads live git and its pane number. Nothing runs in the background.</text>
</svg>